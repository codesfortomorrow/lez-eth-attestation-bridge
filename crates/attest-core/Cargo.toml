[package]
license = "MIT OR Apache-2.0"
description = "Verification core for trustless Ethereum state attestation on LEZ"
name = "attest-core"
version = "0.1.0"
edition = "2024"

[features]
default = ["loader"]
loader = ["dep:serde_json"]
# tiny-keccak backend so the guest can patch in RISC Zero's accelerated fork
zkvm-accel = ["alloy-primitives/tiny-keccak"]

[dependencies]
alloy-primitives = { version = "1", features = ["serde", "rlp"] }
alloy-rlp = "0.3.17"
alloy-trie = { version = "0.9.9", features = ["ethereum"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", optional = true }
sha2 = "=0.10.9"  # RISC Zero patches 0.10.x
thiserror = "2.0.21"

[dev-dependencies]
hex = "0.4.3"
serde_json = "1.0.154"

